[package]
name = "ivm"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pgnumeric = { path = "../pgnumeric" }
pgdatetime = { path = "../pgdatetime" }
pgproto = { path = "../pgproto" }
pgfuncs = { path = "../pgfuncs" }
sqlparser = "0.63.0"
crc32fast = "1.5.3"
smallvec = "1.16.4"
rustc-hash = "2.1.3"
parking_lot = "0.13.0"
crossbeam-channel = "0.5.17"
log = "0.4.34"
env_logger = "0.11.11"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
num-integer = "0.1.47"
mimalloc = { version = "0.1.52", default-features = false }
# graceful shutdown of the server binary on SIGINT / SIGTERM
signal-hook = "0.3"
# web UI (--http-listen): HTTP/1.1 server on its own tokio runtime
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.6.11", features = ["timeout", "limit", "compression-gzip", "set-header"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
base64 = "0.22.1"
# peeking at Unix-domain connections (UnixStream::peek is unstable)
socket2 = "0.6.5"

[dev-dependencies]
proptest = "1.12.0"
